name: Mail-Wächter

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten prüfen (GitHub kann sich ein paar Minuten verspäten)
    - cron: "7 18 * * *"     # täglich ca. 19 Uhr: Lebenszeichen + Wachhalten
  workflow_dispatch:          # manuell starten über "Run workflow"

permissions:
  contents: read
  actions: write              # nur für das Wachhalten (siehe unten)

concurrency:
  group: mailwaechter
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4

      # Merkt sich, welche Warnungen schon verschickt wurden – damit eine hängende
      # Warnung nicht alle 10 Minuten neu kommt, sondern nur einmal (+ Erinnerung).
      - name: Zustand laden
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .zustand
          key: mw-zustand-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mw-zustand-

      - name: Postfach prüfen
        run: python3 mailwaechter.py
        env:
          GMX_USER: ${{ secrets.GMX_USER }}
          GMX_PASSWORD: ${{ secrets.GMX_PASSWORD }}
          SENDER_ADDRESSES: ${{ secrets.SENDER_ADDRESSES }}
          SENDER_NAMES: ${{ secrets.SENDER_NAMES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIND_NAME: ${{ secrets.KIND_NAME }}
          ANDERE_KINDER: ${{ secrets.ANDERE_KINDER }}
          START_DATUM: ${{ vars.START_DATUM }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          HEARTBEAT: ${{ github.event.schedule == '7 18 * * *' }}

      # Unabhängiger Wachdienst: meldet sich healthchecks.io eine Stunde lang kein
      # erfolgreicher Lauf, schickt healthchecks.io SELBST eine Warnung (Telegram/Mail).
      # Das greift auch, wenn GitHub komplett ausfällt oder der Ablauf pausiert ist.
      - name: Wachdienst – Lauf erfolgreich
        if: success()
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 15 --retry 5 --retry-all-errors -o /dev/null "$HEALTHCHECK_URL"
          fi

      # GitHub pausiert geplante Abläufe nach 60 Tagen ohne Änderung am Repo.
      # Das hier schaltet ihn täglich wieder "aktiv", damit er nie einschläft.
      - name: Wachhalten
        if: github.event.schedule == '7 18 * * *'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mailwaechter.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      # Bei einem Fehler: Warnung aufs Handy – über zwei getrennte Wege.
      # Telegram meldet einen Dauerfehler nur EINMAL (+ Erinnerung alle 12 Std.),
      # nicht bei jedem Lauf. Klappt das Programm selbst nicht, Ersatzweg per curl.
      - name: Fehleralarm
        if: failure() || cancelled()
        env:
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 15 --retry 3 -o /dev/null "$HEALTHCHECK_URL/fail" || true
          fi
          python3 mailwaechter.py --fehleralarm "$LINK" || \
          curl -sS -m 20 --retry 3 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Mail-Wächter: Das Postfach konnte gerade NICHT geprüft werden. Bis das behoben ist, bitte selbst in GMX nachsehen (auch im Spam-Ordner). Details: $LINK" || true

      - name: Zustand speichern
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .zustand
          key: mw-zustand-${{ github.run_id }}-${{ github.run_attempt }}
